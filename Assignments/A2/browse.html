<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Paws & Claws - Browse</title>
    <link rel="stylesheet" href="/styles/style.css">
</head>
<body>
    <!-- Header -->
    <header>
        <img src="/images/banner.jpg" alt="center name banner">
        <!-- Navigation links-->
        <nav>
            <a href="/">Home</a>
            <a href="/browse" class="active">Browse Pets</a>
            <a href="/applications">View Applications</a>
            <a href="/about">About Us</a>
        </nav>
    </header>
    <main>
        <h1>Select a Shelter</h1>
        <select id="location"></select>
        <p id="message" class="message"></p> <!-- fetch errors are shown here -->
        <div id="typeButtons" hidden>
            <button type="button" data-category="All">All</button>
            <button type="button" data-category="Cats">Cats</button>
            <button type="button" data-category="Dogs">Dogs</button>
            <button type="button" data-category="Birds">Birds</button>
            <button type="button" data-category="Reptiles">Reptiles</button>
            <button type="button" data-category="Other">Other</button>
        </div>
        <section id="pets"></section>
    </main>
    <footer>
        <hr>
        <p>&copy; 2026 Paws &amp; Claws | Open Your Heart, Change a Life</p>
    </footer>
    <script src="/js/browse.js"></script>
</body>
</html>
