<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Paws & Claws - Applications</title>
    <link rel="stylesheet" href="/styles/style.css">
    <link rel="stylesheet" href="/styles/applications.css">
</head>
<body>
    <!-- Header -->
    <header>
        <img src="/images/banner.jpg" alt="center name banner">
        <!-- Navigation links-->
        <nav>
            <a href="/">Home</a>
            <a href="/browse">Browse Pets</a>
            <a href="/applications" class="active">View Applications</a>
            <a href="/about">About Us</a>
        </nav>
    </header>
    <main>
        <h1>Submitted Applications</h1>
        <p id="message" class="message"></p> <!-- load / update errors are shown here -->
        <section id="tableWrapper">
            <table id="applicationsTable">
                <thead>
                    <tr>
                        <th>Date Submitted</th>
                        <th>Application ID</th>
                        <th>Shelter ID</th>
                        <th>Pet ID</th>
                        <th>Pet Type</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="applicationsBody">
                    <!-- JS creates one row per application here -->
                </tbody>
            </table>
        </section>

        <!-- Filled in by JS when a View button is toggled on -->
        <section id="applicationDetails" hidden></section>
    </main>
    <footer>
        <hr>
        <p>&copy; 2026 Paws &amp; Claws | Open Your Heart, Change a Life</p>
    </footer>
    <script src="/js/applications.js"></script>
</body>
</html>
